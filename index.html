<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARVY App Launcher</title>
<style>
  :root {
    --bg: #f4f7f5;
    --card: #ffffff;
    --accent: #187a4e;
    --accent-hover: #12643f;
    --text: #152c22;
    --muted: #62776c;
    --shadow: 0 10px 30px rgba(24, 122, 78, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 36px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid #dbe6df;
  }
  .logo {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    margin: 0 auto 16px;
    background: #e8f5ee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--accent); }
  p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(24, 122, 78, 0.25);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    background: #eaf3ed;
    color: var(--accent);
  }
  .note {
    margin-top: 18px;
    font-size: 12px;
    color: #8da295;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">♻️</div>
  <h1>ARVY Mobile</h1>
  <p id="msg">Tap the button below to open your ARVY App, or download the installer if you don't have it yet.</p>

  <!-- Opisyal na Android Intent URL para sa Chrome -->
  <a id="btn-open" class="btn btn-primary" href="intent://open#Intent;scheme=arvy;package=com.example.recyclewifi;end">
    Open ARVY App
  </a>

  <!-- Direct Download ng APK -->
  <a id="btn-download" class="btn btn-secondary" href="arvy.apk" download>
    Download APK
  </a>

  <div class="note">Reverse Vending Machine System</div>
</div>

<script>
  // Android Intent URI (subok na sa Google Chrome sa Android)
  const intentUri = "intent://open#Intent;scheme=arvy;package=com.example.recyclewifi;end";

  // Subukang buksan agad pagka-load
  window.onload = function() {
    window.location.href = intentUri;
  };
</script>

</body>
</html>
