<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARVY Mobile App</title>
<style>
  :root {
    --bg: #f4f7f5;
    --card: #ffffff;
    --accent: #187a4e;
    --accent-dark: #12643f;
    --text: #152c22;
    --muted: #62776c;
    --shadow: 0 10px 30px rgba(24, 122, 78, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 36px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid #dbe6df;
  }
  .logo {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    margin: 0 auto 16px;
    background: #e8f5ee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--accent); }
  p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: transform 0.15s, background 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(24, 122, 78, 0.25);
  }
  .btn-primary:active { transform: scale(0.98); background: var(--accent-dark); }
  .btn-secondary {
    background: #eaf3ed;
    color: var(--accent);
  }
  .btn-secondary:active { transform: scale(0.98); }
  .note {
    margin-top: 20px;
    font-size: 12px;
    color: #8da295;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">♻️</div>
  <h1>ARVY Mobile</h1>
  <p>Piliin ang opsyon sa ibaba upang buksan ang app o i-download ang installer sa iyong telepono.</p>

  <!-- Direktang nagbubukas gamit ang Android Intent nang WALANG Play Store fallback -->
  <a id="btn-open" class="btn btn-primary" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.example.recyclewifi;component=com.example.recyclewifi/.SplashActivity;end">
    Buksan ang ARVY App
  </a>

  <!-- Direktang Download ng APK -->
  <a id="btn-download" class="btn btn-secondary" href="arvy.apk" download>
    I-download ang APK Installer
  </a>

  <div class="note">
    Kung wala pang naka-install na app, i-click ang <b>Download APK Installer</b>.
  </div>
</div>

<script>
  // Subukang i-trigger ang app kapag pinindot ang Open button
  document.getElementById('btn-open').addEventListener('click', function(e) {
    // Walang redirect papuntang Play Store kapag hindi nakita
  });
</script>

</body>
</html>
