<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARVY App Launcher & Download</title>
<style>
  :root {
    --bg: #f4f7f5;
    --card: #ffffff;
    --accent: #187a4e;
    --accent-hover: #12643f;
    --text: #152c22;
    --muted: #62776c;
    --shadow: 0 10px 30px rgba(24, 122, 78, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid #dbe6df;
  }
  .logo {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    margin: 0 auto 16px;
    background: #e8f5ee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: var(--accent); }
  p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(24, 122, 78, 0.2);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    background: #eaf3ed;
    color: var(--accent);
  }
  .status {
    font-size: 12px;
    color: #8da295;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">♻️</div>
  <h1>ARVY Mobile</h1>
  <p id="msg">Opening ARVY App on your device… If it doesn't open automatically, download the installer below.</p>

  <a id="btn-open" class="btn btn-primary" href="arvy://open">Open ARVY App</a>
  <a id="btn-download" class="btn btn-secondary" href="arvy.apk" download>Download APK</a>

  <div class="status" id="timer-text">Checking app installation…</div>
</div>

<script>
  // Link para sa Deep Link scheme ng inyong App
  const appScheme = "arvy://open";
  // Direct download link ng inyong APK sa parehong repository
  const apkDownloadUrl = "https://lewynski.github.io/arvy/arvy.apk";

  function tryOpenApp() {
    const start = Date.now();
    
    // Subukang buksan ang app gamit ang custom scheme
    window.location.href = appScheme;

    // Timer para mag-fallback sa download kung hindi bumukas ang app sa loob ng 1.5 seconds
    setTimeout(() => {
      // Kung nanatili pa rin sa browser ang user (hindi nag-minimize ang browser para buksan ang app):
      if (document.hidden || document.webkitHidden) {
        return; // Nabuksan na ang app
      }
      
      const elapsed = Date.now() - start;
      if (elapsed < 2500) {
        document.getElementById("msg").textContent = "ARVY App is not yet installed. Starting APK download…";
        document.getElementById("timer-text").textContent = "Downloading installer…";
        window.location.href = apkDownloadUrl;
      }
    }, 1500);
  }

  // Patakbuhin kaagad pagka-scan ng QR code
  window.addEventListener("DOMContentLoaded", tryOpenApp);
</script>

</body>
</html>
